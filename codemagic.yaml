workflows:
  ios-unsigned-ipa:
    name: Build Unsigned IPA
    triggering:
      events: [push]
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Build
        script: |
          set -e
          xcodebuild \
            -project SakuraPlanner.xcodeproj \
            -scheme SakuraPlanner \
            -configuration Release \
            -sdk iphoneos \
            -derived-data build/derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build
      - name: Package IPA
        script: |
          set -e
          APP_PATH=$(find build/derived/Build/Products -name "*.app" | head -n1)
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r SakuraPlanner.ipa Payload
          ls -la
    artifacts:
      - build/ipa/*.ipa
