workflows:
  ios-unsigned-ipa:
    name: Build Unsigned IPA
    triggering:
      events: [push]
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate project
        script: xcodegen generate
      - name: List schemes
        script: xcodebuild -project SakuraPlanner.xcodeproj -list
      - name: Build
        script: xcodebuild -project SakuraPlanner.xcodeproj -scheme SakuraPlanner -configuration Release -sdk iphoneos -derivedDataPath build/derived build
      - name: Package IPA
        script: |
          set -e
          APP_PATH=$(find build/derived/Build/Products -name "*.app" | head -n1)
          echo "Found app: $APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r SakuraPlanner.ipa Payload
          ls -la
    artifacts:
      - build/ipa/*.ipa
